Bertindaklah sebagai Senior Procurement & Strategic Sourcing Manager. Audiens adalah Commercial Director Vendor Cloud.

[C - Context & Conditions]
Kemitraan berjalan 2 tahun dengan SLA memuaskan. Ada arahan rasionalisasi budget 15% dari direksi. Kontrak berakhir dalam 45 hari.

[T - Target & Task]
Susun email negosiasi kontrak 2 tahun ke depan dengan penyesuaian tarif 15% atau volume diskon tambahan tanpa menurunkan SLA 99.9%.

[I - Intention & Impact]
Kemitraan win-win jangka panjang tanpa kesan krisis likuiditas, melainkan disiplin efisiensi bersama.

[O - Output & Organization]
Format Minto Pyramid (SCQA). Maksimal 4 paragraf lugas. Berikan 3 opsi skema fleksibilitas penutup.

[N - Negatives & Non-negotiables]
DILARANG mengancam pemutusan kontrak sepihak. Jangan mengutip data biaya rahasia kompetitor lain.

[S - Steps & Sequencing]
1. Apresiasi SLA 2 tahun terakhir.
2. Paparkan konteks pembaruan strategi korporat.
3. Tawarkan perpanjangan multi-year sebagai kompensasi harga.
4. Undang sesi diskusi 20 menit minggu ini.`,notes:"Ditambahkan skema trade-off multi-year, struktur SCQA, dan batasan nada non-konfrontatif.",facilitatorScore:9.5,facilitatorFeedback:"Evolusi luar biasa. Penggunaan trade-off multi-year memberikan leverage nyata bagi kedua belah pihak."}]},{id:"jp-2",title:"Memo Internal: Restrukturisasi Tim Berbasis AI",description:"Komunikasi perubahan sensitif untuk menjaga rasa aman psikologis dan kestabilan kerja.",departmentTag:"HR",currentVersion:2,score:9.6,isPublic:!0,authorName:"Mariyah (HR Lead)",createdAt:"2026-09-12",updatedAt:"2026-09-15",versions:[{version:1,date:"Day 1 (Before)",frameworkUsed:"Draft Awal",promptText:"Buatkan memo resmi dari HRD untuk semua karyawan tentang restrukturisasi divisi teknologi dan pemindahan beberapa posisi.",notes:"Kaku dan berpotensi memicu rumor liar di kalangan staf."},{version:2,date:"Day 3 (After)",frameworkUsed:"A.C.T.I.O.N.S. & Crucial Conversations",promptText:`[A - Actor & Audience]
Bertindaklah sebagai Chief People Officer bersama CEO. Audiens adalah seluruh staf dan manajer lintas divisi.

[C - Context & Conditions]
Transformasi ke model cross-functional squad berbasis AI. Sebagian peran bergeser fungsi tanpa adanya PHK.

[T - Target & Task]
Susun memo internal yang mengumumkan restrukturisasi tim ini secara transparan, empatik, dan menenangkan.

[I - Intention & Impact]
Meredam kecemasan (psychological safety) dan menegaskan adanya jalur reskilling yang didampingi penuh manajemen.

[O - Output & Organization]
1. Mengapa kita berubah sekarang.
2. Apa yang berubah vs apa yang TETAP UTUH (stabilitas).
3. Jadwal sesi townhall terbuka per divisi.

[N - Negatives & Non-negotiables]
HINDARI jargon dingin ('downsizing', 'optimalisasi aset manusia'). Dilarang membuat janji palsu.

[S - Steps & Sequencing]
Buka dengan apresiasi dedikasi, jelaskan visi pertumbuhan, lalu berikan transparansi roadmap langkah berikutnya.`,notes:"Fokus pada Psychological Safety, kepastian tidak ada PHK, dan jadwal sesi dialog terbuka.",facilitatorScore:9.6,facilitatorFeedback:"Nuansa empati pemimpin sangat terasa. Menghilangkan kecemasan tanpa kehilangan ketegasan arah."}]},{id:"jp-3",title:"Sintesis Dokumen Riset Pasar 80 Halaman",description:"Mengekstrak intisari laporan panjang menjadi matriks keputusan 3 skenario untuk direksi.",departmentTag:"Strategy",currentVersion:2,score:9.3,isPublic:!0,authorName:"Farha (Strategic Planner)",createdAt:"2026-09-13",updatedAt:"2026-09-16",versions:[{version:1,date:"Day 2 (Before)",frameworkUsed:"Ringkasan Pasif",promptText:"Ringkas dokumen riset pasar ini dan berikan poin-poin penting apa yang harus dilakukan perusahaan.",notes:"Terlalu umum, tidak siap dijadikan bahan pengambilan keputusan dewan direksi."},{version:2,date:"Day 5 (After)",frameworkUsed:"Syntopical Reading & Devil's Advocate",promptText:`Bertindaklah sebagai Senior Strategic Advisor Dewan Direksi.
Lakukan dekonstruksi analitis terhadap laporan terlampir dengan metodologi Syntopical Reading & First-Principles:

1. CORE THESIS: Premis utama dokumen dan bukti empiris yang paling rentan dibantah.
2. AUDIT RISIKO: Gunakan sudut pandang Devil's Advocate (apa blind-spot terbesar jika rekomendasi ini kita ambil?).
3. MATRIKS KEPUTUSAN: Tabel 3 kolom (Skenario Tindakan, Dampak EBITDA & Modal, Mitigasi Risiko Kunci).
4. VERDICT: 1 paragraf rekomendasi final yang lugas untuk diputuskan pada rapat BOD.`,notes:"Mengubah ringkasan pasif menjadi matriks keputusan 3 skenario siap saji.",facilitatorScore:9.3,facilitatorFeedback:"Sudut pandang Devil's Advocate pada poin 2 memaksa AI menguji risiko yang sering diabaikan."}]}],Hd=["Semua","Finance","HR","Strategy","Operations","Marketing","Tech"],l1=[{num:"01",tag:"1 → 10",title:"Get the Gist Instantly",subtitle:"High-Level Executive Summary",theory:"Cognitive Load Theory (John Sweller)",desc:"Minta AI merangkum materi kompleks dalam 3 lapis pemahaman: untuk anak 10 tahun, praktisi, dan CEO.",prompt:"Jelaskan tesis utama dokumen ini dalam 3 lapis: (1) Konsep sederhana, (2) Implikasi bisnis strategis, (3) Satu titik kerentanan kritis terbesar."},{num:"02",tag:"10 → 1",title:"Create Structured Outlines",subtitle:"Deconstruct & Decision Matrix",theory:"Schema Theory (Jean Piaget)",desc:"Ubah materi panjang menjadi matriks tabel keputusan: Masalah, Akar Penyebab, Intervensi, dan Titik Gagal.",prompt:"Dekonstruksi dokumen strategi ini menjadi matriks keputusan: Masalah Utama, Akar Penyebab, Intervensi Solutif, Estimasi Dampak, dan Titik Risiko Kegagalan."},{num:"03",tag:"10 ↔ 10",title:"Syntopical Reading & Debate",subtitle:"Cross-Pollinate Perspectives",theory:"Dialectical Inquiry (Mortimer Adler)",desc:"Adu argumentasi antara dokumen A dan dokumen B melalui simulasi debat kritis AI.",prompt:"Ambil sudut pandang Dokumen A dan lakukan kritik tajam terhadap temuan Dokumen B. Di mana titik ketidaksesuaian logikanya?"},{num:"04",tag:"1 → 1",title:"Deep Mastery & Socratic Loop",subtitle:"Mental Model Stress-Testing",theory:"Feynman Technique & Socratic Inquiry",desc:"Uji apakah Anda benar-benar paham suatu konsep melalui sesi tanya jawab sokratik yang menantang asumsi Anda.",prompt:"Bertindaklah sebagai Socrates. Tanyakan 3 pertanyaan paling sulit mengenai proposal bisnis saya ini hingga ke akar logikanya."},{num:"05",tag:"10 → 10+",title:"Accelerate Your Research",subtitle:"Discover Research Gaps",theory:"Dual Coding Theory (Allan Paivio)",desc:"Temukan pola tersembunyi dan celah riset di antara tumpukan dokumen referensi multi-sumber.",prompt:"Berdasarkan seluruh dokumen terlampir, sebutkan di mana titik konsensus para ahli, apa yang masih diperdebatkan, dan apa research gap yang belum terjawab?"}],n1=[{id:"zero-shot",title:"Zero-Shot & Few-Shot Prompting",tag:"Foundational",desc:"Mengunci gaya keluaran dan format AI dengan memberikan contoh konkret (2-3 contoh) daripada instruksi abstrak.",steps:["Definisikan format target","Berikan 2 contoh input -> output yang ideal","Minta AI melanjutkan pola yang sama"],example:`Contoh 1:
